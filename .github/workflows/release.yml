name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

env:
  PROJECT_PATH: src/Db2.HealthChecks/Db2.HealthChecks.csproj
  TEST_PROJECT_PATH: tests/Db2.HealthChecks.Tests/Db2.HealthChecks.Tests.csproj

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Install Db2 client native dependencies
        run: sudo apt-get update && sudo apt-get install -y libxml2 libaio1t64

      - name: Configure Db2 native client library path
        shell: bash
        run: |
          set -euo pipefail
          CLI_LIB_DIR="$GITHUB_WORKSPACE/tests/Db2.HealthChecks.Tests/bin/Release/net10.0/clidriver/lib"
          if [ ! -f "$CLI_LIB_DIR/libdb2.so" ]; then
            echo "::error::Db2 clidriver not found in test output. Expected $CLI_LIB_DIR/libdb2.so"
            exit 1
          fi
          echo "LD_LIBRARY_PATH=$CLI_LIB_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "Db2 clidriver configured at $CLI_LIB_DIR"

      - name: Test .NET 8
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} --framework net8.0 -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
        env:
          RUN_DB2_INTEGRATION_TESTS: false

      - name: Test .NET 10
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} --framework net10.0 -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
        env:
          RUN_DB2_INTEGRATION_TESTS: true

      - name: Pack
        run: dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --no-build -o ./artifacts -p:ContinuousIntegrationBuild=true

      - name: Check vulnerable packages
        run: dotnet list package --vulnerable --include-transitive

      - name: Verify public API baseline
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore --no-incremental

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
