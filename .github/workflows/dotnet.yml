name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-pack:
    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Db2 client native dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libxml2 libaio1t64

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Configure Db2 native client library path (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          CLI_LIB_DIR="$GITHUB_WORKSPACE/src/Db2.Test/bin/Release/net10.0/clidriver/lib"
          if [ ! -f "$CLI_LIB_DIR/libdb2.so" ]; then
            echo "::error::Db2 clidriver not found in test output. Expected $CLI_LIB_DIR/libdb2.so"
            exit 1
          fi
          echo "LD_LIBRARY_PATH=$CLI_LIB_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "Db2 clidriver configured at $CLI_LIB_DIR"

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
        env:
          RUN_DB2_INTEGRATION_TESTS: ${{ matrix.os == 'ubuntu-latest' }}

      - name: Pack validation
        run: dotnet pack src/Db2.HealthChecks/Db2.HealthChecks.csproj --configuration Release --no-build -o ./artifacts -p:ContinuousIntegrationBuild=true

      - name: Verify package metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f ./artifacts/*.nupkg
          unzip -l ./artifacts/*.nupkg | grep -q 'README.md'
          unzip -l ./artifacts/*.nupkg | grep -q 'LICENSE'

      - name: Check vulnerable packages
        run: dotnet list package --vulnerable --include-transitive

      - name: Verify public API baseline
        run: dotnet build src/Db2.HealthChecks/Db2.HealthChecks.csproj --configuration Release --no-restore --no-incremental

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: ./artifacts/*.*nupkg
